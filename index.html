<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Archiwum</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 48px 16px; }
  code { display: block; margin: 16px 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<a id="open"></a>
<code id="code"></code>
<script>
  const hash = location.hash.slice(1);
  if (/^\d{8}\.\d{6}\.\d+(-\d{8}\.\d{6}\.\d+)?$/.test(hash)) {
    const code = "archiwum:" + hash;
    const open = document.getElementById("open");
    open.href = code;
    open.textContent = "Otwórz w Archiwum";
    document.getElementById("code").textContent = code;
    location.href = code;
  }
</script>
</body>
</html>
